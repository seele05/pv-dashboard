# Beispiel. Vorher: cp config.example.js config.js und anpassen.
services:
  pv-dashboard:
    build: .
    image: pv-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config.js:/app/config.js:ro
      - pv-data:/app/data
    # Zum Ausprobieren ohne InfluxDB und ohne config.js:
    # command: ["node", "main.js", "--mock"]

volumes:
  pv-data:
